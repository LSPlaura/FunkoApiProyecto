services:
  db:
    image: postgres:17-alpine
    container_name: funkos_efcore_db_api
    ports:
      - "5433:5432"
    environment:
      POSTGRES_DB: funkos
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin123
    volumes:
      - pgdata_api:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U admin" ]
      interval: 5s
      timeout: 5s
      retries: 5

  funkoapi:
    environment:
      ConnectionStrings__DefaultConnection: Host=db;Port=5432;Database=funkos;Username=admin;Password=admin123
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata_api:
