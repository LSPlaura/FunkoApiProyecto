info:
  name: "[003] GET - By Id (Admin)"
  type: http
  seq: 3

http:
  method: GET
  url: "{{baseUrl}}/api/proveedores/{{proveedorId}}"
  auth:
    type: bearer
    token: "{{adminToken}}"

runtime:
  scripts:
    - type: after-response
      code: |-
        test("Proveedores GetById - Status 200 OK", function () {
            expect(res.getStatus()).to.equal(200);
        });
        test("Proveedores GetById - Returns proveedor", function () {
            const jsonData = res.getBody();
            expect(jsonData.id).to.equal(bru.getVar("proveedorId"));
            expect(jsonData.nombre).to.equal(bru.getVar("proveedorNombre"));
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
