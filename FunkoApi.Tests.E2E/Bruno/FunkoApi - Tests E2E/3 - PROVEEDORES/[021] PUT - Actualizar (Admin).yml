info:
  name: "[021] PUT - Actualizar (Admin)"
  type: http
  seq: 21

http:
  method: PUT
  url: "{{baseUrl}}/api/proveedores/{{proveedorId}}"
  body:
    type: json
    data: |-
      { "nombre": "{{proveedorNombreActualizado}}" }
  auth:
    type: bearer
    token: "{{adminToken}}"

runtime:
  scripts:
    - type: after-response
      code: |-
        test("Proveedores Update - Status 200 OK", function () {
            expect(res.getStatus()).to.equal(200);
        });
        test("Proveedores Update - Returns updated proveedor", function () {
            const jsonData = res.getBody();
            expect(jsonData.id).to.equal(bru.getVar("proveedorId"));
            expect(jsonData.nombre).to.equal(bru.getVar("proveedorNombreActualizado"));
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
