info:
  name: "[023] DELETE - Eliminar (Admin)"
  type: http
  seq: 23

http:
  method: DELETE
  url: "{{baseUrl}}/api/proveedores/{{proveedorId}}"
  auth:
    type: bearer
    token: "{{adminToken}}"

runtime:
  scripts:
    - type: after-response
      code: |-
        test("Proveedores Delete - Status 200 OK", function () {
            expect(res.getStatus()).to.equal(200);
        });
        test("Proveedores Delete - Returns true", function () {
            expect(res.getBody()).to.equal(true);
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
