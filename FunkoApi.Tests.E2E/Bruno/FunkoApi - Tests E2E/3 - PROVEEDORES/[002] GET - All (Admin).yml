info:
  name: "[002] GET - All (Admin)"
  type: http
  seq: 2

http:
  method: GET
  url: "{{baseUrl}}/api/proveedores"
  auth:
    type: bearer
    token: "{{adminToken}}"

runtime:
  scripts:
    - type: after-response
      code: |-
        test("Proveedores GetAll - Status 200 OK", function () {
            expect(res.getStatus()).to.equal(200);
        });
        test("Proveedores GetAll - Response is array", function () {
            expect(res.getBody()).to.be.an("array");
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
