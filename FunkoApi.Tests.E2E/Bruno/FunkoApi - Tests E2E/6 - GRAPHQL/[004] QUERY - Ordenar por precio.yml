info:
  name: "[004] QUERY - Ordenar por precio"
  type: http
  seq: 4

http:
  method: POST
  url: "{{baseUrl}}/graphql"
  body:
    type: json
    data: |-
      {
        "query": "query { funkos(order: { precio: DESC }) { nodes { id nombre precio } } }"
      }
  auth:
    type: none

runtime:
  scripts:
    - type: after-response
      code: |-
        test("GraphQL Sort - Status 200 OK", function () {
            expect(res.getStatus()).to.equal(200);
        });
        test("GraphQL Sort - No errors", function () {
            expect(res.getBody().errors).to.be.undefined;
        });
        test("GraphQL Sort - Prices descending", function () {
            const funkos = res.getBody().data.funkos.nodes;
            expect(funkos).to.be.an("array").that.is.not.empty;
            for (let i = 1; i < funkos.length; i++) {
                expect(funkos[i - 1].precio).to.be.at.least(funkos[i].precio);
            }
        });
