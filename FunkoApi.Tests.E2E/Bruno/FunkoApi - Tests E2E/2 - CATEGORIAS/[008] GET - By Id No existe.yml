info:
  name: "[008] GET - By Id No existe"
  type: http
  seq: 23

http:
  method: GET
  url: "{{baseUrl}}/api/categorias/999999"
  auth:
    type: bearer
    token: "{{adminToken}}"

runtime:
  scripts:
    - type: after-response
      code: |-
        test("Categorias GetById NotFound - Status 404", function () {
            expect(res.getStatus()).to.equal(404);
        });

        test("Categorias GetById NotFound - Has error message", function () {
            const jsonData = res.getBody();
            expect(jsonData.message).to.not.be.empty;
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
