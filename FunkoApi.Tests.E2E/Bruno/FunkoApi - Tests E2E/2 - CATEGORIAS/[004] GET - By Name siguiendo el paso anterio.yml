info:
  name: "[004] GET - By Name siguiendo el paso anterio"
  type: http
  seq: 3

http:
  method: GET
  url: "{{baseUrl}}/api/categorias/nombre?name=Categoria E2E"
  params:
    - name: name
      value: Categoria E2E
      type: query
  auth:
    type: bearer
    token: "{{adminToken}}"

runtime:
  scripts:
    - type: after-response
      code: |-
        test("Categorias GetByName - Status 200 OK", function () {
            expect(res.getStatus()).to.equal(200);
        });

        test("Categorias GetByName - Returns categoria", function () {
            const jsonData = res.getBody();
            expect(jsonData.nombre).to.equal("Categoria E2E");
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
