info:
  name: "[003] GET - By Id"
  type: http
  seq: 2

http:
  method: GET
  url: "{{baseUrl}}/api/categorias/{{categoriaId}}"
  auth:
    type: bearer
    token: "{{adminToken}}"

runtime:
  scripts:
    - type: after-response
      code: |-
        test("Categorias GetById - Status 200 OK", function () {
            expect(res.getStatus()).to.equal(200);
        });

        test("Categorias GetById - Returns categoria", function () {
            const jsonData = res.getBody();
            expect(jsonData.nombre).to.equal("Categoria E2E");
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
