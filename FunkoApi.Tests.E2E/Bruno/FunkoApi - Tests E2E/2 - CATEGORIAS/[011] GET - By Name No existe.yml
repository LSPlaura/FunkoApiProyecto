info:
  name: "[011] GET - By Name No existe"
  type: http
  seq: 26

http:
  method: GET
  url: "{{baseUrl}}/api/categorias/nombre?name=Categoria Inexistente E2E"
  params:
    - name: name
      value: Categoria Inexistente E2E
      type: query
  auth:
    type: bearer
    token: "{{adminToken}}"

runtime:
  scripts:
    - type: after-response
      code: |-
        test("Categorias GetByName NotFound - Status 404", function () {
            expect(res.getStatus()).to.equal(404);
        });

        test("Categorias GetByName NotFound - Has error message", function () {
            const jsonData = res.getBody();
            expect(jsonData.message).to.not.be.empty;
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
