info:
  name: "[018] GET - By Name (User)"
  type: http
  seq: 8

http:
  method: GET
  url: "{{baseUrl}}/api/categorias/nombre?name={{categoriaNombre}}"
  params:
    - name: name
      value: "{{categoriaNombre}}"
      type: query
  auth:
    type: bearer
    token: "{{userToken}}"

runtime:
  scripts:
    - type: after-response
      code: |-
        test("Categorias GetByName User - Status 200 OK", function () {
            expect(res.getStatus()).to.equal(200);
        });

        test("Categorias GetByName User - Returns categoria", function () {
            const jsonData = res.getBody();
            expect(jsonData.id).to.equal(bru.getVar("categoriaId"));
            expect(jsonData.nombre).to.equal(bru.getVar("categoriaNombre"));
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
