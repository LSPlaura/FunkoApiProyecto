info:
  name: "[029] GET - By Name sin auth"
  type: http
  seq: 19

http:
  method: GET
  url: "{{baseUrl}}/api/categorias/nombre?name={{categoriaNombre}}"
  params:
    - name: name
      value: "{{categoriaNombre}}"
      type: query

runtime:
  scripts:
    - type: after-response
      code: |-
        test("Categorias GetByName NoAuth - Status 401 Unauthorized", function () {
            expect(res.getStatus()).to.equal(401);
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
