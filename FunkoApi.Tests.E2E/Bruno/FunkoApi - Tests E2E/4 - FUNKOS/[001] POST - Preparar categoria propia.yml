info:
  name: "[001] POST - Preparar categoria propia"
  type: http
  seq: 1

http:
  method: POST
  url: "{{baseUrl}}/api/categorias"
  body:
    type: json
    data: |-
      { "nombre": "{{funkoCategoriaNombre}}" }
  auth:
    type: bearer
    token: "{{adminToken}}"

runtime:
  scripts:
    - type: after-response
      code: |-
        bru.setVar("funkoCategoriaId", null);
        test("Funkos Setup Categoria - Status 201 Created", function () {
            expect(res.getStatus()).to.equal(201);
        });
        test("Funkos Setup Categoria - Returns categoria", function () {
            const jsonData = res.getBody();
            expect(jsonData.id).to.be.a("string");
            expect(jsonData.id).to.not.be.empty;
            expect(jsonData.nombre).to.equal(bru.getVar("funkoCategoriaNombre"));
        });
        if (res.getStatus() === 201) {
            bru.setVar("funkoCategoriaId", res.getBody().id);
        }

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
