info:
  name: "[048] GET - Paged (Admin)"
  type: http
  seq: 48

http:
  method: GET
  url: "{{baseUrl}}/api/funkos/paged?page=1&pageSize=2"
  params:
    - name: page
      value: "1"
      type: query
    - name: pageSize
      value: "2"
      type: query
  auth:
    type: bearer
    token: "{{adminToken}}"

runtime:
  scripts:
    - type: after-response
      code: |-
        test("Funkos GetPaged Admin - Status 200 OK", function () {
            expect(res.getStatus()).to.equal(200);
        });
        test("Funkos GetPaged Admin - Returns page", function () {
            const jsonData = res.getBody();
            expect(jsonData.data).to.be.an("array");
            expect(jsonData.pagination.page).to.equal(1);
            expect(jsonData.pagination.pageSize).to.equal(2);
            expect(jsonData.pagination.totalPages).to.be.a("number");
            expect(jsonData.pagination.totalItems).to.be.a("number");
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
