info:
  name: "[039] GET - Paged parametro no numerico"
  type: http
  seq: 39

http:
  method: GET
  url: "{{baseUrl}}/api/funkos/paged?page=abc&pageSize=2"
  params:
    - name: page
      value: abc
      type: query
    - name: pageSize
      value: "2"
      type: query
  auth:
    type: bearer
    token: "{{adminToken}}"

runtime:
  scripts:
    - type: after-response
      code: |-
        test("Funkos GetPaged InvalidPage - Status 400", function () {
            expect(res.getStatus()).to.equal(400);
        });
        test("Funkos GetPaged InvalidPage - Validation errors", function () {
            expect(res.getBody().errors).to.be.an("object");
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
