info:
  name: "[025] PUT - Rol USER"
  type: http
  seq: 25

http:
  method: PUT
  url: "{{baseUrl}}/api/funkos/{{funkoId}}"
  body:
    type: multipart-form
    data:
      - name: nombre
        type: text
        value: "{{funkoNombre}} Prohibido"
      - name: precio
        type: text
        value: "19.99"
      - name: stock
        type: text
        value: "5"
      - name: categoriaId
        type: text
        value: "{{funkoCategoriaId}}"
      - name: proveedorId
        type: text
        value: "{{funkoProveedorId}}"
      - name: archivo
        type: file
        value:
          - ../../../SeedImages/funkos/DefaultImage.jpg
  auth:
    type: bearer
    token: "{{userToken}}"

runtime:
  scripts:
    - type: after-response
      code: |-
        test("Funkos Update User - Status 403 Forbidden", function () {
            expect(res.getStatus()).to.equal(403);
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
