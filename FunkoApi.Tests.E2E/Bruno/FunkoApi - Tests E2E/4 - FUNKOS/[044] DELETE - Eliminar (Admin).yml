info:
  name: "[044] DELETE - Eliminar (Admin)"
  type: http
  seq: 44

http:
  method: DELETE
  url: "{{baseUrl}}/api/funkos/{{funkoId}}"
  auth:
    type: bearer
    token: "{{adminToken}}"

runtime:
  scripts:
    - type: after-response
      code: |-
        test("Funkos Delete - Status 200 OK", function () {
            expect(res.getStatus()).to.equal(200);
        });
        test("Funkos Delete - Returns true", function () {
            expect(res.getBody()).to.equal(true);
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
