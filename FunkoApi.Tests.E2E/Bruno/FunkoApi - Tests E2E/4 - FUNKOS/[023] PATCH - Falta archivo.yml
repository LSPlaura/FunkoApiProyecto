info:
  name: "[023] PATCH - Falta archivo"
  type: http
  seq: 23

http:
  method: PATCH
  url: "{{baseUrl}}/api/funkos/{{funkoId}}/imagen"
  body:
    type: multipart-form
    data:
      - name: otroCampo
        type: text
        value: sin-archivo
  auth:
    type: bearer
    token: "{{adminToken}}"

runtime:
  scripts:
    - type: after-response
      code: |-
        test("Funkos PatchImage MissingFile - Status 400", function () {
            expect(res.getStatus()).to.equal(400);
        });
        test("Funkos PatchImage MissingFile - Validation errors", function () {
            expect(res.getBody().errors).to.be.an("object");
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
