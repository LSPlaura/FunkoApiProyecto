info:
  name: "[032] GET - By Name sin auth"
  type: http
  seq: 32

http:
  method: GET
  url: "{{baseUrl}}/api/funkos/{{funkoNombre}}"

runtime:
  scripts:
    - type: after-response
      code: |-
        test("Funkos GetByName NoAuth - Status 401 Unauthorized", function () {
            expect(res.getStatus()).to.equal(401);
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
