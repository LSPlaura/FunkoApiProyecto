info:
  name: "[007] GET - By Id (Admin)"
  type: http
  seq: 7

http:
  method: GET
  url: "{{baseUrl}}/api/funkos/{{funkoId}}"
  auth:
    type: bearer
    token: "{{adminToken}}"

runtime:
  scripts:
    - type: after-response
      code: |-
        test("Funkos GetById - Status 200 OK", function () {
            expect(res.getStatus()).to.equal(200);
        });
        test("Funkos GetById - Returns funko", function () {
            const jsonData = res.getBody();
            expect(jsonData.id).to.equal(bru.getVar("funkoId"));
            expect(jsonData.nombre).to.equal(bru.getVar("funkoNombre"));
            expect(jsonData.categoria.id).to.equal(bru.getVar("funkoCategoriaId"));
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
