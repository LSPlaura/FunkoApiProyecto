info:
  name: "[009] POST - Nombre duplicado"
  type: http
  seq: 9

http:
  method: POST
  url: "{{baseUrl}}/api/funkos"
  body:
    type: multipart-form
    data:
      - name: nombre
        type: text
        value: "{{funkoNombre}}"
      - name: precio
        type: text
        value: "19.99"
      - name: stock
        type: text
        value: "5"
      - name: categoriaId
        type: text
        value: "{{funkoCategoriaId}}"
      - name: proveedorId
        type: text
        value: "{{funkoProveedorId}}"
  auth:
    type: bearer
    token: "{{adminToken}}"

runtime:
  scripts:
    - type: after-response
      code: |-
        test("Funkos Create Duplicate - Status 409 Conflict", function () {
            expect(res.getStatus()).to.equal(409);
        });
        test("Funkos Create Duplicate - Has message", function () {
            expect(res.getBody().message).to.not.be.empty;
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
