info:
  name: "[038] GET - Paged ajusta limites"
  type: http
  seq: 38

http:
  method: GET
  url: "{{baseUrl}}/api/funkos/paged?page=0&pageSize=101"
  params:
    - name: page
      value: "0"
      type: query
    - name: pageSize
      value: "101"
      type: query
  auth:
    type: bearer
    token: "{{adminToken}}"

runtime:
  scripts:
    - type: after-response
      code: |-
        test("Funkos GetPaged Limits - Status 200 OK", function () {
            expect(res.getStatus()).to.equal(200);
        });
        test("Funkos GetPaged Limits - Clamps page and pageSize", function () {
            const jsonData = res.getBody();
            expect(jsonData.data).to.be.an("array");
            expect(jsonData.pagination.page).to.equal(1);
            expect(jsonData.pagination.pageSize).to.equal(100);
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
