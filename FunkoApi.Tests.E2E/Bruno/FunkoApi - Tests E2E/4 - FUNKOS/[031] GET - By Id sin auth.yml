info:
  name: "[031] GET - By Id sin auth"
  type: http
  seq: 31

http:
  method: GET
  url: "{{baseUrl}}/api/funkos/{{funkoId}}"

runtime:
  scripts:
    - type: after-response
      code: |-
        test("Funkos GetById NoAuth - Status 401 Unauthorized", function () {
            expect(res.getStatus()).to.equal(401);
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
