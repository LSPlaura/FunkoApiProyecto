info:
  name: "[014] PUT - Proveedor inexistente"
  type: http
  seq: 14

http:
  method: PUT
  url: "{{baseUrl}}/api/funkos/{{funkoId}}"
  body:
    type: multipart-form
    data:
      - name: nombre
        type: text
        value: "{{funkoNombre}}"
      - name: precio
        type: text
        value: "19.99"
      - name: stock
        type: text
        value: "5"
      - name: categoriaId
        type: text
        value: "{{funkoCategoriaId}}"
      - name: proveedorId
        type: text
        value: fffffffffffffffffffffffe
  auth:
    type: bearer
    token: "{{adminToken}}"

runtime:
  scripts:
    - type: after-response
      code: |-
        test("Funkos Update MissingProveedor - Status 400", function () {
            expect(res.getStatus()).to.equal(400);
        });
        test("Funkos Update MissingProveedor - Has message", function () {
            expect(res.getBody().message).to.not.be.empty;
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
