info:
  name: "[035] DELETE - Sin auth"
  type: http
  seq: 35

http:
  method: DELETE
  url: "{{baseUrl}}/api/funkos/{{funkoId}}"

runtime:
  scripts:
    - type: after-response
      code: |-
        test("Funkos Delete NoAuth - Status 401 Unauthorized", function () {
            expect(res.getStatus()).to.equal(401);
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
