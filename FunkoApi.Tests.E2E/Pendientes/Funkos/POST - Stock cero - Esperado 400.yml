info:
  name: POST - Stock cero - Esperado 400
  type: http
  seq: 2

http:
  method: POST
  url: "{{baseUrl}}/api/funkos"
  body:
    type: multipart-form
    data:
      - name: nombre
        type: text
        value: "{{funkoNombre}} Stock Cero"
      - name: precio
        type: text
        value: "19.99"
      - name: stock
        type: text
        value: "0"
      - name: categoriaId
        type: text
        value: "{{funkoCategoriaId}}"
      - name: proveedorId
        type: text
        value: "{{funkoProveedorId}}"
  auth:
    type: bearer
    token: "{{adminToken}}"

runtime:
  scripts:
    - type: after-response
      code: |-
        test("Funkos Create ZeroStock - Status 400", function () {
            expect(res.getStatus()).to.equal(400);
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
