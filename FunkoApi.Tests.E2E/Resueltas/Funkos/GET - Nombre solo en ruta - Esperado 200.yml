info:
  name: GET - Nombre solo en ruta - Esperado 200
  type: http
  seq: 8

http:
  method: GET
  url: "{{baseUrl}}/api/funkos/nombre/{{funkoNombre}}"
  auth:
    type: bearer
    token: "{{adminToken}}"

runtime:
  scripts:
    - type: after-response
      code: |-
        // Escenario integrado en [008] de la coleccion activa. Se conserva esta plantilla.
        test("Funkos GetByName Route - Status 200 OK", function () {
            expect(res.getStatus()).to.equal(200);
        });
        test("Funkos GetByName Route - Returns funko", function () {
            expect(res.getBody().id).to.equal(bru.getVar("funkoId"));
            expect(res.getBody().nombre).to.equal(bru.getVar("funkoNombre"));
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
